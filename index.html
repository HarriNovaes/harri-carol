<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7f3450"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Harri & Carol ❤️</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#452d39;background:#fff9f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:600px;margin:auto;min-height:100dvh;padding:22px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.brand{font-family:Georgia,serif;font-size:26px;color:#813a54;font-weight:bold}.tag{font-size:12px;color:#9a6b7b}.hero{position:relative;height:280px;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #8a4a5b25}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 37%}.hero:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#25161dbd)}.heroText{position:absolute;z-index:1;bottom:18px;left:19px;color:white}.heroText h1{font:28px Georgia,serif;margin:4px 0}.heroText p{margin:0;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat,.panel,.tile{background:white;border:1px solid #f3dfe5;border-radius:18px;padding:15px;box-shadow:0 5px 18px #7b39500a}.stat strong{display:block;color:#843c57;font-size:21px}.stat small{color:#8d7880}.heading{font:23px Georgia,serif;margin:24px 0 12px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tile{text-align:left;min-height:92px;color:#613b4c}.tile span{font-size:26px;display:block;margin-bottom:7px}.tile b{font-size:14px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffdfcf2;border-top:1px solid #f1dce3;display:flex;justify-content:space-around;padding:11px 4px calc(11px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:#90727e;font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center}.nav button span{font-size:22px}.nav button.active{color:#813a54;font-weight:700}.hidden{display:none}.sectionTitle{font:27px Georgia,serif;color:#7f3450;margin:10px 0}.muted{color:#917c85;font-size:13px;line-height:1.5}.panel{margin:12px 0}.field{width:100%;border:1px solid #e7ccd5;border-radius:12px;padding:12px;background:#fff;margin:6px 0 10px;color:#452d39}.primary{border:0;border-radius:12px;background:#823b55;color:#fff;padding:12px 18px;font-weight:650}.secondary{border:1px solid #e9cad5;border-radius:10px;background:#fff;color:#823b55;padding:8px 10px}.entry{border-bottom:1px solid #f2e2e7;padding:12px 0;overflow-wrap:anywhere}.entry:last-child{border-bottom:0}.entry small{color:#977b86}.entry p{white-space:pre-wrap}.empty{padding:16px;color:#917c85;text-align:center}.month{font-weight:700;color:#803b55}.pill{background:#f9e8ee;border-radius:50px;padding:6px 11px;font-size:12px;color:#7e3b55;display:inline-block}.footer{text-align:center;font-size:11px;color:#a28c96;margin:28px 0}.notice{background:#fff1e5;border:1px solid #f4ddc8;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;color:#785544}input[type=file]{font-size:13px}img.memory{width:100%;max-height:280px;object-fit:contain;border-radius:12px;background:#f8eef1;margin-top:8px}
</style></head><body><main class="app"><div class="top"><div><div class="brand">Harri <span style="color:#d79cae">&</span> Carol ♡</div><div class="tag">Nosso pequeno universo</div></div><span style="font-size:27px">💗</span></div><section id="home"><div class="hero"><img src="familia.jpg" alt="Foto da família"><div class="heroText"><div>O nosso amor, a nossa história</div><h1>Nós três, para sempre ♡</h1><p>Desde 19 de janeiro de 2020</p></div></div><div class="stats"><div class="stat"><strong id="together">—</strong><small>dias de história juntos</small></div><div class="stat"><strong id="luaAge">—</strong><small>meses da nossa Lua 🌙</small></div></div><h2 class="heading">Nosso cantinho</h2><div class="tiles" id="tiles"></div><div class="footer">Feito com amor, para nossa família ♡</div></section><section id="detail" class="hidden"><button class="secondary" onclick="go('home')">← Início</button><h1 class="sectionTitle" id="detailTitle"></h1><p class="muted" id="detailDesc"></p><div id="detailBody"></div></section></main><nav class="nav"><button data-nav="home" onclick="go('home')" class="active"><span>⌂</span>Início</button><button data-nav="agenda" onclick="go('agenda')"><span>▦</span>Agenda</button><button data-nav="lua" onclick="go('lua')"><span>☾</span>Lua</button><button data-nav="cartas" onclick="go('cartas')"><span>♡</span>Cartas</button><button data-nav="financas" onclick="go('financas')"><span>◈</span>Finanças</button></nav><script>
const pages=[['agenda','📅','Nossa agenda','Compromissos, consultas e datas importantes.'],['financas','💰','Nossas finanças','Registrem entradas e despesas da casa.'],['compras','🛒','Lista de compras','Tudo que precisamos comprar.'],['tarefas','🏠','Tarefas da casa','Organizem o dia a dia juntos.'],['lua','🌙','Cantinho da Lua','Memórias, fotos e mêsversários da nossa filha.'],['fotos','📸','Recordações','Momentos especiais da nossa história.'],['metas','✨','Metas e sonhos','Planos para o nosso futuro.'],['cartas','💌','Cartas e mensagens','Palavras para guardar com carinho.'],['saude','🩺','Saúde e consultas','Lembretes de cuidados e consultas.'],['passeios','🌷','Passeios e lazer','Ideias para viver momentos juntos.']];
const start=new Date(2020,0,19),born=new Date(2026,0,28),now=new Date();document.getElementById('together').textContent=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/86400000).toLocaleString('pt-BR');let months=(now.getFullYear()-born.getFullYear())*12+now.getMonth()-born.getMonth()-(now.getDate()<born.getDate()?1:0);document.getElementById('luaAge').textContent=Math.max(0,months);document.getElementById('tiles').innerHTML=pages.map(p=>`<button class="tile" onclick="go('${p[0]}')"><span>${p[1]}</span><b>${p[2]}</b></button>`).join('');
let current='home';const storageKey=k=>'hc-v1-'+k;const read=k=>{try{return JSON.parse(localStorage.getItem(storageKey(k))||'[]')}catch{return []}};const save=(k,v)=>localStorage.setItem(storageKey(k),JSON.stringify(v));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(id){current=id;document.getElementById('home').classList.toggle('hidden',id!=='home');document.getElementById('detail').classList.toggle('hidden',id==='home');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));if(id!=='home')render();window.scrollTo(0,0)}
function render(){let p=pages.find(x=>x[0]===current);if(!p)return;document.getElementById('detailTitle').textContent=p[1]+' '+p[2];document.getElementById('detailDesc').textContent=p[3];let b=document.getElementById('detailBody');let photo=['lua','fotos'].includes(current);let fin=current==='financas';let letter=current==='cartas';let event=['agenda','saude','passeios'].includes(current);b.innerHTML=`<div class="notice">🔒 Versão inicial: registros salvos somente neste navegador, sem sincronização entre celulares. Não insira informações sensíveis ainda.</div><div class="panel"><form id="entryForm"><label>${letter?'Sua carta':photo?'Legenda da lembrança':fin?'Descrição':event?'Compromisso':'Novo registro'}</label>${letter?'<textarea class="field" name="title" required rows="4" placeholder="Escreva sua mensagem..."></textarea>':'<input class="field" name="title" required maxlength="250" placeholder="Escreva aqui...">'}${fin?'<select class="field" name="type"><option value="Despesa">Despesa</option><option value="Entrada">Entrada</option></select><input class="field" name="value" type="number" min="0" step="0.01" placeholder="Valor (R$)" required>':''}${event?'<input class="field" name="date" type="datetime-local" required>':''}${photo?'<input class="field" name="photo" type="file" accept="image/*"><p class="muted">Fotos pequenas podem ser armazenadas neste aparelho. O armazenamento definitivo será configurado depois.</p>':''}${current==='lua'?'<input class="field" name="month" type="number" min="0" max="240" placeholder="Mêsversário (0 para nascimento)">':''}<button class="primary" type="submit">Guardar ♡</button></form></div><div class="panel"><strong>${letter?'Cartas guardadas':'Nossos registros'}</strong><div id="entries"></div></div>`;document.getElementById('entryForm').onsubmit=submit;renderEntries()}
function renderEntries(){const box=document.getElementById('entries');let items=read(current);if(!items.length){box.innerHTML='<div class="empty">Nosso primeiro registro começa aqui ♡</div>';return}box.innerHTML=items.map((x,i)=>`<div class="entry"><small>${esc(x.created)} ${x.date?' · '+esc(new Date(x.date).toLocaleString('pt-BR')):''} ${x.month!==''&&x.month!=null?' · '+esc(x.month)+'º mês':''}</small><p>${esc(x.title)}</p>${x.type?`<b>${esc(x.type)}: ${Number(x.value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</b>`:''}${x.photo?`<img class="memory" src="${x.photo}" alt="Recordação">`:''}<div><button class="secondary" onclick="removeEntry(${i})">Excluir</button></div></div>`).join('')}
function removeEntry(i){if(!confirm('Excluir este registro?'))return;let a=read(current);a.splice(i,1);save(current,a);renderEntries()}
function submit(e){e.preventDefault();const f=e.target;const d=new FormData(f);const item={title:String(d.get('title')||'').trim(),created:new Date().toLocaleDateString('pt-BR'),date:d.get('date')||'',type:d.get('type')||'',value:d.get('value')||'',month:d.get('month')??''};if(!item.title)return;const file=f.elements.photo?.files?.[0];if(file){if(file.size>700000){alert('Para esta versão, escolha uma foto com menos de 700 KB. O armazenamento de fotos será ampliado depois.');return}const reader=new FileReader();reader.onload=()=>{item.photo=reader.result;commit(item)};reader.readAsDataURL(file)}else commit(item)}
function commit(item){try{let a=read(current);a.unshift(item);save(current,a);render()}catch{alert('Espaço do navegador esgotado. Não foi possível guardar este registro.')}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
